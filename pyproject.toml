[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odos"
version = "0.1.0"
description = "ODOS Sprint 1.1 starter project"
authors = [
  { name = "ODOS Team" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110.1",
  "uvicorn>=0.27.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.11.0",
  "jinja2>=3.1.0",
  "httpx>=0.24.0",
  "python-multipart>=0.0.6",
  "aiofiles>=23.2.1",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "xlrd>=2.0.1",
  "requests>=2.32.0"
]
