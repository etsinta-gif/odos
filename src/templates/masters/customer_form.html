<!-- src/templates/masters/customer_form.html -->
{% extends "masters/base.html" %}

{% block title %}
    {% if action == 'add' %}Add Customer{% else %}Edit Customer{% endif %}
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{% if action == 'add' %}Add Customer{% else %}Edit Customer{% endif %}</h1>
    <a href="/masters/customers" class="btn btn-secondary">Back to List</a>
</div>

<div class="form-container">
    <form method="POST" action="{% if action == 'add' %}/masters/customers{% else %}/masters/customers/{{ customer.customer_id }}/edit{% endif %}">
        <div class="form-group">
            <label for="full_name">Full Name *</label>
            <input type="text" id="full_name" name="full_name" value="{{ customer.full_name if customer else '' }}" required>
        </div>
        <div class="form-group">
            <label for="pan">PAN *</label>
            <input type="text" id="pan" name="pan" value="{{ customer.pan if customer else '' }}" required>
        </div>
        <div class="form-group">
            <label for="gstin">GSTIN</label>
            <input type="text" id="gstin" name="gstin" value="{{ customer.gstin if customer else '' }}">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ customer.email if customer else '' }}">
        </div>
        <div class="form-group">
            <label for="mobile">Mobile</label>
            <input type="text" id="mobile" name="mobile" value="{{ customer.mobile if customer else '' }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/masters/customers" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
