{% extends "masters/base.html" %}

{% block title %}{{ 'Edit' if action == 'edit' else 'Add' }} Commission - ODOS Enterprise{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Edit' if action == 'edit' else 'Add' }} Commission</h1>
    <a href="/masters/commission" class="btn btn-secondary">Back to Commission</a>
</div>

<form method="POST" action="{% if action == 'edit' %}/masters/commission/{{ commission.commission_id }}/edit{% else %}/masters/commission{% endif %}" class="form-card">
    <div class="form-row">
        <label for="case_id">Case</label>
        <select id="case_id" name="case_id" required>
            <option value="">Select case</option>
            {% for case in cases %}
                <option value="{{ case.case_id }}" {% if case.case_id == selected_case_id %}selected{% endif %}>
                    {{ case.case_number }} - {{ case.customer_name }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="form-row">
        <label for="connector_id">Connector</label>
        <select id="connector_id" name="connector_id" required>
            <option value="">Select connector</option>
            {% for connector in connectors %}
                <option value="{{ connector.connector_id }}" {% if connector.connector_id == selected_connector_id %}selected{% endif %}>
                    {{ connector.full_name }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="form-row">
        <label for="commission_date">Commission Date</label>
        <input type="date" id="commission_date" name="commission_date" required value="{{ commission.commission_date if commission else '' }}">
    </div>
    <div class="form-row">
        <label for="base_commission_amount">Base Commission Amount</label>
        <input type="number" step="0.01" id="base_commission_amount" name="base_commission_amount" required value="{{ commission.base_commission_amount if commission else request.query_params.get('base_commission', '') }}">
    </div>
    <div class="form-row">
        <label for="bonus_commission_amount">Bonus Commission Amount</label>
        <input type="number" step="0.01" id="bonus_commission_amount" name="bonus_commission_amount" value="{{ commission.bonus_commission_amount if commission else '' }}">
    </div>
    <div class="form-row">
        <label for="gross_commission_amount">Gross Commission Amount</label>
        <input type="number" step="0.01" id="gross_commission_amount" name="gross_commission_amount" required value="{{ commission.gross_commission_amount if commission else '' }}">
    </div>
    <div class="form-row">
        <label for="gst_amount">GST Amount</label>
        <input type="number" step="0.01" id="gst_amount" name="gst_amount" value="{{ commission.gst_amount if commission else request.query_params.get('gst_amount', '') }}">
    </div>
    <div class="form-row">
        <label for="tds_amount">TDS Amount</label>
        <input type="number" step="0.01" id="tds_amount" name="tds_amount" value="{{ commission.tds_amount if commission else request.query_params.get('tds_amount', '') }}">
    </div>
    <div class="form-row">
        <label for="net_amount">Net Amount</label>
        <input type="number" step="0.01" id="net_amount" name="net_amount" required value="{{ commission.net_amount if commission else request.query_params.get('net_amount', '') }}">
    </div>
    <div class="form-row">
        <label for="payment_status">Payment Status</label>
        <select id="payment_status" name="payment_status" required>
            {% for status in payment_statuses %}
                <option value="{{ status }}" {% if commission and commission.payment_status == status %}selected{% elif not commission and status == 'PENDING' %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-row">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes">{{ commission.notes if commission else '' }}</textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{ 'Save Changes' if action == 'edit' else 'Create Commission' }}</button>
    </div>
</form>
{% endblock %}
