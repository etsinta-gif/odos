<!-- src/templates/masters/dsa_form.html -->
{% extends "masters/base.html" %}

{% block title %}
    {% if action == 'add' %}Add DSA{% else %}Edit DSA{% endif %}
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{% if action == 'add' %}Add DSA{% else %}Edit DSA{% endif %}</h1>
    <a href="/masters/dsas" class="btn btn-secondary">Back to List</a>
</div>

<div class="form-container">
    <form method="POST" action="{% if action == 'add' %}/masters/dsas{% else %}/masters/dsas/{{ dsa.dsa_id }}/edit{% endif %}">
        <div class="form-group">
            <label for="dsa_code">DSA Code *</label>
            <input type="text" id="dsa_code" name="dsa_code" value="{{ dsa.dsa_code if dsa else '' }}" required>
        </div>
        <div class="form-group">
            <label for="dsa_name">DSA Name *</label>
            <input type="text" id="dsa_name" name="dsa_name" value="{{ dsa.dsa_name if dsa else '' }}" required>
        </div>
        <div class="form-group">
            <label for="contact_person">Contact Person</label>
            <input type="text" id="contact_person" name="contact_person" value="{{ dsa.contact_person if dsa else '' }}">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ dsa.email if dsa else '' }}">
        </div>
        <div class="form-group">
            <label for="mobile">Mobile</label>
            <input type="text" id="mobile" name="mobile" value="{{ dsa.mobile if dsa else '' }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/masters/dsas" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
