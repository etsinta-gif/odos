<!-- src/templates/masters/employee_form.html -->
{% extends "masters/base.html" %}

{% block title %}
    {% if action == 'add' %}Add Employee{% else %}Edit Employee{% endif %}
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{% if action == 'add' %}Add Employee{% else %}Edit Employee{% endif %}</h1>
    <a href="/masters/employees" class="btn btn-secondary">Back to List</a>
</div>

<div class="form-container">
    <form method="POST" action="{% if action == 'add' %}/masters/employees{% else %}/masters/employees/{{ employee.employee_id }}/edit{% endif %}">
        <div class="form-group">
            <label for="employee_code">Employee Code *</label>
            <input type="text" id="employee_code" name="employee_code" value="{{ employee.employee_code if employee else '' }}" required>
        </div>
        <div class="form-group">
            <label for="full_name">Full Name *</label>
            <input type="text" id="full_name" name="full_name" value="{{ employee.full_name if employee else '' }}" required>
        </div>
        <div class="form-group">
            <label for="designation">Designation</label>
            <input type="text" id="designation" name="designation" value="{{ employee.designation if employee else '' }}">
        </div>
        <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" name="department" value="{{ employee.department if employee else '' }}">
        </div>
        <div class="form-group">
            <label for="branch_id">Branch ID</label>
            <input type="number" id="branch_id" name="branch_id" value="{{ employee.branch_id if employee else '' }}">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ employee.email if employee else '' }}">
        </div>
        <div class="form-group">
            <label for="mobile">Mobile</label>
            <input type="text" id="mobile" name="mobile" value="{{ employee.mobile if employee else '' }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/masters/employees" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
